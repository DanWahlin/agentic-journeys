name: AIMarket Factory steady-state advancement
"on":
  pull_request:
    types: [opened, closed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aimarket-factory-state
  cancel-in-progress: false
jobs:
  reconcile:
    if: >-
      vars.AIMARKET_FACTORY_ENABLED == 'true' &&
      ((github.event_name == 'pull_request' &&
        (github.event.action == 'opened' || github.event.pull_request.merged == true)) ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
      checks: read
      actions: read
    steps:
      - name: Check out the trusted default branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Project human merge and advance approved dependency-ready work
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/factory-state-controller.mjs
