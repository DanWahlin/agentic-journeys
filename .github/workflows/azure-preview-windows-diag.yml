name: Azure preview on Windows (diagnostic)

# Runs `azd provision --preview` for SmartTodo's Phase 3 checkpoint on a Windows runner
# with the same OIDC sign-in as the journey workflow. It creates no resources.

on:
  workflow_dispatch:
  push:
    branches: ["run/windows-preview"]

permissions:
  contents: read
  id-token: write

jobs:
  preview:
    runs-on: windows-latest
    environment: journey-windows
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: Azure/setup-azd@0b7e3a35ab00f2eee7080c845eb39c3f0ebfa553 # v2.4.0
      - name: Preview SmartTodo's Phase 3 checkpoint
        shell: pwsh
        working-directory: journeys/smart-todo/checkpoints/phase-3/journey
        run: |
          az bicep install
          azd config set auth.useAzCliAuth true
          azd env new preview-diag --location westus --subscription $env:AZURE_SUBSCRIPTION_ID --no-prompt
          $sp = az ad sp show --id $env:AZURE_CLIENT_ID --query "{id:id, name:displayName}" -o json | ConvertFrom-Json
          azd env set AZURE_PRINCIPAL_ID $env:AZURE_CLIENT_ID
          azd env set AZURE_PRINCIPAL_LOGIN $sp.name
          azd env set AZURE_PRINCIPAL_TYPE ServicePrincipal
          azd env set AZURE_AI_MODEL_VERSION 2025-08-07
          azd provision --preview --no-prompt
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Delete the empty resource group the preview created
        if: always()
        shell: pwsh
        run: |
          $groups = az group list --tag azd-env-name=preview-diag --query "[].name" -o tsv
          foreach ($g in $groups) { az group delete --name $g --yes --no-wait }
